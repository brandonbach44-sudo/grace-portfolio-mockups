<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Option C · Semester</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a teacher's planner — 15 week rows x 3 class columns on faint grid paper; margin notes in handwriting. */
:root{
  --paper:#fafaf6;
  --grid:#e6e9e1;
  --ink:#24302a;
  --muted:#6f786f;
  --line:#c9cfc3;
  --k1:#4e7d5b;   /* class 1: sage green */
  --k2:#c08a1e;   /* class 2: gold */
  --k3:#3d6a99;   /* class 3: slate blue */
  --sans:"Lexend","Avenir Next",Verdana,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:inherit}
:focus-visible{outline:2px solid var(--k3);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.mock{font-size:12px;color:var(--muted);padding-block:12px}
.mock b{font-weight:600;color:var(--ink)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:18px;border-bottom:2px solid var(--ink)}
.brand{font-weight:600;font-size:20px;text-decoration:none}
.brand small{display:block;font-weight:300;font-size:13px;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border:1.5px solid transparent}
nav a:hover{border-color:var(--line)}
nav a.on{border-color:var(--ink);background:var(--paper)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.5vw,2.9rem);letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0;max-width:64ch}
.ph{color:var(--muted)}
.note{font-family:var(--hand);font-size:1.35rem;color:var(--k3);line-height:1.1}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{padding-top:36px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{font:inherit;font-size:13px;font-weight:500;background:var(--paper);border:1.5px solid var(--line);padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.legend button i{width:10px;height:10px;display:inline-block;background:var(--c)}
.legend button.off{opacity:.45}
/* planner */
.planner-wrap{overflow-x:auto;margin-top:18px;background:var(--paper);border:2px solid var(--ink)}
.planner{display:grid;grid-template-columns:120px repeat(3,minmax(180px,1fr));min-width:680px}
.planner .h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:10px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px}
.planner .h i{width:12px;height:12px;background:var(--c)}
.planner .wk{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-decoration:none;display:block}
.planner .wk b{font-weight:600;font-size:15px;display:block}
.planner .wk span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.planner .cell{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--c);transition:background .15s}
.planner .cell:last-child{border-right:0}
.planner .cell .t{font-weight:500}
.planner .cell .s{font-size:12px;color:var(--muted)}
.planner .cell .sk{font-size:11px;font-weight:500;align-self:flex-start;padding:1px 6px;border:1px solid var(--line);margin-block:2px}
.legend button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.planner .row:hover>*{background:#f0f2ea}
.planner .row{display:contents}
.planner .cell.dim{opacity:.18}
.planner .cell.empty .t{color:var(--muted);font-weight:300;font-style:italic}
/* week page */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.col{background:var(--paper);border-top:5px solid var(--c);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.col li a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.col li a:hover .t{text-decoration:underline;text-underline-offset:3px}
.col .s{font-size:12px;color:var(--muted);white-space:nowrap}
.journal{background:var(--paper);border:1px solid var(--line);padding:20px 22px;position:relative}
.journal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px)}
.weeknav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weeknav a{text-decoration:none;font-weight:500;padding:6px 12px;border:1.5px solid var(--ink);background:var(--paper)}
.weeknav a:hover{background:var(--ink);color:var(--paper)}
.weeknav a.disabled{opacity:.3;pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.thumbs div{aspect-ratio:8.5/11;max-width:100%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}
/* lesson */
.sheet{background:var(--paper);border:2px solid var(--ink);padding:28px clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;padding:4px 10px;border:1px solid var(--line)}
.part{display:grid;grid-template-columns:170px 1fr;gap:20px;border-top:1px solid var(--line);padding-top:14px}
.part>*{min-width:0}
.part ul{margin:0;padding-left:18px}
.btn{display:inline-block;text-decoration:none;font-weight:500;padding:9px 14px;border:1.5px solid var(--ink);background:var(--paper)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.mgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.bigprev{aspect-ratio:8.5/11;max-width:100%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;padding:12px;background:var(--paper)}
.rr{display:grid;grid-template-columns:180px 1fr;gap:20px;border-top:1px solid var(--line);padding-top:14px}
.rr>*{min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end;padding-top:32px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--ink);background:var(--paper)}
.stats div{padding:12px 14px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .hero,.days,.part,.rr,.mgrid{grid-template-columns:1fr}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="plain">
/* Plain review mode: same type and color in all four options so only the organization differs. */
:root{--plain-font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-family:var(--plain-font)!important;font-weight:400!important}
h1,h2,h3,.brand,.name,.lbl,.tt{font-family:var(--plain-font)!important;letter-spacing:-.01em!important}
.ph,.lede{font-style:normal!important}
h1{font-size:clamp(1.8rem,4vw,2.4rem)!important;font-weight:700!important;line-height:1.15!important}
h2{font-size:1.3rem!important;font-weight:700!important}
h3{font-weight:600!important}
:root{--paper:#fff;--grid:#fff;--ink:#1a1a1a;--muted:#666;--line:#ddd;--k1:#1a1a1a;--k2:#777;--k3:#bbb;--sans:var(--plain-font);--hand:var(--plain-font)}
body{background-image:none!important}
.note{font-size:.95rem!important;color:var(--muted)!important}
</style>

<div class="wrap">
  <div class="mock"><a href="index.html" style="color:inherit;font-weight:600">← All options</a> · <b>Option C · Semester</b> · organized by week · placeholder content</div>
  <header>
    <a class="brand" href="#home">[Grace's Full Name]<small>Special Education · [Semester, Year]</small></a>
    <nav aria-label="Main">
      <a href="#home" data-r="home">Semester</a>
      <a href="#about" data-r="about">About</a>
      <a href="#resume" data-r="resume">Résumé</a>
    </nav>
  </header>
  <main id="page" tabindex="-1"></main>
</div>

<script>
const K=[{n:"[Class 1]",c:"var(--k1)"},{n:"[Class 2]",c:"var(--k2)"},{n:"[Class 3]",c:"var(--k3)"}];
const on=[true,true,true];
const W=15;
let lastWeek=1;
const TOP=["[Money & Banking]","[Time & Measurement]","[Equations & Algebra]","[Social & Emotional Skills]","[Organization & Self-Advocacy]"];
let hi=-1;

function planner(){
  return `<div class="planner-wrap"><div class="planner" role="table">
    <div class="h">Week</div>${K.map(k=>`<div class="h"><i style="--c:${k.c}"></i>${k.n}</div>`).join("")}
    ${Array.from({length:W},(_,w)=>`<div class="row">
      <a class="wk" href="#week-${w+1}"><b>Week ${w+1}</b><span>[MM/DD–MM/DD]</span></a>
      ${K.map((k,i)=>{const empty=(w===0&&i===2);const sk=(w+i*2)%5;return `<a class="cell${on[i]&&(hi<0||sk===hi)?"":" dim"}${empty?" empty":""}" style="--c:${k.c}" href="#week-${w+1}">
        <span class="t">${empty?"[Observation week]":"[Topic / unit]"}</span>${empty?"":`<span class="sk">${TOP[sk]}</span>`}<span class="s">${empty?"":"[#] plans · [#] materials"}</span></a>`}).join("")}
    </div>`).join("")}
  </div></div>`;
}

const V={
home:()=>`<section class="hero">
  <div class="stack">
    <div class="label">Student teaching portfolio</div>
    <h1>[Headline: e.g. A semester of teaching, week by week]</h1>
    <p class="ph">[Two sentences: where she taught, which classes, and what this planner shows.]</p>
  </div>
  <div class="stack">
    <div class="note">[note: "click any week to open it →"]</div>
    <div class="stats"><div><b>15</b><span>weeks</span></div><div><b>3</b><span>classes</span></div><div><b>[#]</b><span>lesson plans</span></div></div>
  </div>
</section>
<section class="sec">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center">
    <h2>The semester planner</h2>
    <div class="legend" aria-label="Show classes">${K.map((k,i)=>`<button data-k="${i}" class="${on[i]?"":"off"}" style="--c:${k.c}" aria-pressed="${on[i]}"><i></i>${k.n}</button>`).join("")}</div>
  </div>
  <div class="legend" aria-label="Highlight a skill" style="padding-top:12px;align-items:center"><span class="label" style="margin-right:4px">Highlight a skill</span>${TOP.map((t,i)=>`<button data-s="${i}" class="${hi===i?"on":""}" aria-pressed="${hi===i}">${t}</button>`).join("")}${hi>=0?`<button data-s="-1">Clear</button>`:""}</div>
  ${planner()}
</section>`,

about:()=>`<section class="sec" style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px">
  <div class="stack">
    <div class="label">About</div>
    <h1>[Heading for her teaching philosophy]</h1>
    <p class="ph">[Paragraph 1 of her teaching philosophy.]</p>
    <p class="ph">[Paragraph 2: planning, routines, differentiation.]</p>
    <p class="ph">[Paragraph 3: families, IEP teams, collaboration.]</p>
  </div>
  <div class="stack" style="padding-top:40px">
    <div class="note">[note: one thing she learned this semester]</div>
    ${K.map(k=>`<div style="border-left:4px solid ${k.c};padding-left:12px"><b style="font-weight:600">${k.n} Name</b><p class="ph" style="font-size:13px">[One-line description]</p></div>`).join("")}
  </div>
</section>`,

resume:()=>`<section class="sec stack" style="gap:22px">
  <div class="label">Résumé</div><h1>[Grace's Full Name]</h1>
  <p class="ph">[City, State] · [email] · [link]</p>
  <div class="btns"><a class="btn" href="#resume">Download PDF</a></div>
  ${["Education","Experience","Certifications","Skills"].map(s=>`<div class="rr"><h3>${s}</h3><div><b style="font-weight:500">[Role / Degree]</b> <span class="ph">· [Organization] · [Dates]</span><p class="ph" style="font-size:14px">[Detail line]</p></div></div>`).join("")}
</section>`,

material:()=>`<section class="sec stack" style="gap:18px">
  <a href="#week-${lastWeek}" style="text-decoration:none;color:var(--muted)">← Back to Week ${lastWeek}</a>
  <div class="sheet">
    <div class="stack" style="gap:10px"><div class="label" style="color:var(--k1)">[Class Name] · Week [#] · Material</div><h1>[Material Title]</h1>
    <div class="facts"><span>[Worksheet]</span><span>${TOP[0]}</span><span>[Made with Canva]</span></div></div>
    <div class="mgrid">
      <div class="stack"><div class="bigprev" id="mprev">[Full-page preview of the worksheet]</div>
        <div class="btns"><button class="btn" data-key>Show answer key</button><a class="btn" href="#material">Download PDF</a></div></div>
      <div class="stack">
        <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:12px"><h3>What students do</h3><p class="ph">[Short description of the activity.]</p></div>
        <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:12px"><h3>How I designed it</h3><p class="ph">[Design choices and supports for her students.]</p></div>
        <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:12px"><h3>Used in</h3><a href="#lesson">[Lesson Title] →</a></div>
        <div class="note">[note: how students responded]</div>
      </div>
    </div>
  </div>
</section>`,

lesson:()=>`<section class="sec stack" style="gap:18px">
  <a href="#week-${lastWeek}" style="text-decoration:none;color:var(--muted)">← Back to Week ${lastWeek}</a>
  <div class="sheet">
    <div class="stack" style="gap:10px">
      <div class="label" style="color:var(--k1)">[Class Name] · Week [#]</div>
      <h1>[Lesson Title]</h1>
      <div class="facts"><span>[Date]</span><span>[Grade]</span><span>[Length]</span><span>${TOP[0]}</span></div>
      <div class="note">[optional note: why she's proud of this lesson]</div>
    </div>
    ${[["Essential question","[Question students reflect on]"],["Standards","[Standard code: text]"],["Objectives","<ul><li>[Objective 1]</li><li>[Objective 2]</li></ul>"],["Differentiation","<ul><li>[Support 1]</li><li>[Support 2]</li></ul>"],["Assessment","[How learning is checked]"],["Sequence","<ul><li>[Warm-up]</li><li>[Instruction]</li><li>[Practice]</li><li>[Closure]</li></ul>"]]
      .map(([h,b])=>`<div class="part"><h3>${h}</h3><div class="ph">${b}</div></div>`).join("")}
    <div class="part"><h3>Materials</h3><div class="thumbs">${[1,2,3].map(i=>`<a href="#material" style="text-decoration:none"><div>[Material ${i}]</div></a>`).join("")}<div style="aspect-ratio:16/9">[Slides]</div></div></div>
    <div class="btns"><a class="btn" href="#lesson">Full plan (PDF)</a></div>
  </div>
</section>`
};

function weekView(w){
  lastWeek=w;
  return `<section class="sec stack" style="gap:24px">
  <div class="weeknav">
    <a href="#week-${w-1}" class="${w===1?"disabled":""}">← Week ${w-1||""}</a>
    <a href="#home">All weeks</a>
    <a href="#week-${w+1}" class="${w===W?"disabled":""}">Week ${w<W?w+1:""} →</a>
  </div>
  <div class="stack" style="gap:6px">
    <div class="label">[MM/DD – MM/DD]</div>
    <h1>Week ${w}</h1>
    <p class="ph">[One-sentence summary of the week.]</p>
  </div>
  <div class="days">
    ${K.map(k=>`<div class="col" style="--c:${k.c}">
      <h3>${k.n} Name</h3>
      <div class="label">Lesson plans</div>
      <ul>${[1,2,3].map(i=>`<li><a href="#lesson"><span class="t">[Lesson ${i} Title]</span><span class="s">${TOP[i%5]} · [Day]</span></a></li>`).join("")}</ul>
      <div class="label">Materials</div>
      <ul>${[1,2].map(i=>`<li><a href="#material"><span class="t">[Material ${i}]</span><span class="s">[Type]</span></a></li>`).join("")}</ul>
    </div>`).join("")}
  </div>
  <div class="journal stack">
    <div class="label">From her journal · Week ${w}</div>
    <p class="ph">[De-identified excerpt from her student teaching journal for this week: what went well, what she adjusted, what she learned.]</p>
    <div class="note">[takeaway note]</div>
  </div>
</section>`;
}

function render(){
  const r=location.hash.slice(1)||"home";
  const page=document.getElementById("page");
  const m=r.match(/^week-(\d+)$/);
  page.innerHTML=m&&+m[1]>=1&&+m[1]<=W?weekView(+m[1]):(V[r]||V.home)();
  const navKey=(m||r==="lesson"||r==="material")?"home":r;
  page.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>{const p=page.querySelector("#mprev");const k=!p.dataset.k;p.dataset.k=k?"1":"";p.textContent=k?"[Answer key preview]":"[Full-page preview of the worksheet]";b.textContent=k?"Show student version":"Show answer key"}));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===navKey));
  page.querySelectorAll(".legend button[data-k]").forEach(b=>b.addEventListener("click",()=>{on[b.dataset.k]=!on[b.dataset.k];const y=scrollY;render();scrollTo(0,y)}));
  page.querySelectorAll(".legend button[data-s]").forEach(b=>b.addEventListener("click",()=>{const s=+b.dataset.s;hi=(hi===s||s<0)?-1:s;const y=scrollY;render();scrollTo(0,y)}));
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();
</script>

</html>
