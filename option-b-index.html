<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Option B · Index</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: strict 12-col Swiss grid; content as indexed, filterable rows; no boxes. */
:root{
  --bg:#ffffff;
  --fg:#0d0d0d;
  --muted:#6b6d76;
  --line:#0d0d0d;
  --faint:#e3e4e8;
  --accent:#1c3fd6;      /* cobalt */
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.mock{font-family:var(--mono);font-size:11px;color:var(--muted);padding-block:12px;border-bottom:1px solid var(--faint)}
header{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding-block:20px;border-bottom:2px solid var(--line)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
nav{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:15px;font-weight:500}
nav a{padding-block:2px;border-bottom:2px solid transparent}
nav a:hover{color:var(--accent)}
nav a.on{border-color:var(--accent);color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.ph{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
.giant{font-size:clamp(3rem,10vw,8.5rem);letter-spacing:-.045em}
h1{font-size:clamp(2.2rem,6vw,4.5rem)}
h2{font-size:1.5rem;letter-spacing:-.01em}
p{margin:0;max-width:62ch}
section{padding-top:48px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.c4{grid-column:span 4}.c8{grid-column:span 8}.c3{grid-column:span 3}.c9{grid-column:span 9}.c6{grid-column:span 6}.c12{grid-column:span 12}
.grid>*{min-width:0}
/* home index */
.idx{border-top:2px solid var(--line)}
.idx a{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--faint)}
.idx a .t{font-size:clamp(1.6rem,4vw,2.8rem);font-weight:800;letter-spacing:-.03em}
.idx a:hover .t{color:var(--accent)}
.idx a .arrow{font-size:1.6rem;transition:transform .15s}
.idx a:hover .arrow{transform:translateX(6px);color:var(--accent)}
/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--faint)}
.filters button{font:inherit;font-size:14px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.filters button:hover{color:var(--fg)}
.filters button.on{color:var(--fg);border-color:var(--fg)}
.filters .lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
/* rows */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:14px 12px 10px 0;border-bottom:2px solid var(--line)}
td{padding:14px 12px 14px 0;border-bottom:1px solid var(--faint);vertical-align:baseline;font-size:15px}
td.num{font-family:var(--mono);font-size:12px;color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
td.title{font-weight:700;font-size:17px}
tr.row{cursor:pointer}
tr.row:hover td.title{color:var(--accent)}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.tag.k1{color:#1c3fd6}.tag.k2{color:#b0442c}.tag.k3{color:#2c7a4b}
/* materials list with squares */
.mat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 24px}
.mat a{display:flex;flex-direction:column;gap:8px}
.sq{aspect-ratio:1;max-width:100%;background:var(--faint);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:8px;transition:background .15s}
.mat a:hover .sq{background:#d5d8e4}
.mat .tt{font-weight:700}
/* lesson detail */
.meta dl{margin:0;display:grid;gap:14px;border-top:2px solid var(--line);padding-top:14px}
.meta dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:500}
.side{position:sticky;top:20px}
.block{border-top:1px solid var(--faint);padding-block:20px;display:grid;grid-template-columns:180px 1fr;gap:20px}
.block>*{min-width:0}
.block h3{font-size:15px;letter-spacing:0;font-weight:700}
.block ul{margin:0;padding-left:18px}
.btn{display:inline-block;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:12px 18px}
.btn:hover{background:var(--accent)}
.btn.alt{background:none;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.btn.alt:hover{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.btn{border:0;font-family:inherit;cursor:pointer}
button.sq{font-family:var(--mono);color:var(--muted)}
.rr{display:grid;grid-template-columns:3fr 9fr;gap:24px;border-top:1px solid var(--faint);padding-block:18px}
.rr>*{min-width:0}
.back{font-family:var(--mono);font-size:12px;color:var(--muted)} .back:hover{color:var(--accent)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
footer{margin-top:72px;border-top:2px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:860px){
  .c4,.c8,.c3,.c9,.c6{grid-column:span 12}
  .mat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .block,.rr{grid-template-columns:1fr;gap:8px}
  .side{position:static}
  header{grid-template-columns:1fr}
  .idx a{grid-template-columns:44px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="plain">
/* Plain review mode: same type and color in all four options so only the organization differs. */
:root{--plain-font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-family:var(--plain-font)!important;font-weight:400!important}
h1,h2,h3,.brand,.name,.lbl,.tt{font-family:var(--plain-font)!important;letter-spacing:-.01em!important}
.ph,.lede{font-style:normal!important}
h1{font-size:clamp(1.8rem,4vw,2.4rem)!important;font-weight:700!important;line-height:1.15!important}
h2{font-size:1.3rem!important;font-weight:700!important}
h3{font-weight:600!important}
:root{--fg:#1a1a1a;--muted:#666;--line:#1a1a1a;--faint:#ddd;--accent:#1a1a1a;--sans:var(--plain-font);--mono:var(--plain-font)}
.giant{font-size:clamp(2.2rem,6vw,3rem)!important}
.idx a .t{font-size:clamp(1.3rem,3vw,1.7rem)!important;font-weight:700!important}
.tag.k1,.tag.k2,.tag.k3{color:#555}
.sq{background:#f2f2f2}
</style>

<div class="wrap">
  <div class="mock"><a href="index.html" style="color:inherit;font-weight:600">← All options</a> · OPTION B — INDEX · organized by type of work · placeholder content</div>
  <header>
    <a class="brand" href="#home">[Grace's Full Name]</a>
    <nav aria-label="Main">
      <a href="#plans" data-r="plans">Lesson Plans</a>
      <a href="#materials" data-r="materials">Materials</a>
      <a href="#slides" data-r="slides">Slides</a>
      <a href="#reflections" data-r="reflections">Reflections</a>
      <a href="#about" data-r="about">About</a>
      <a href="#resume" data-r="resume">Résumé</a>
    </nav>
  </header>
  <main id="page" tabindex="-1"></main>
  <footer class="mono"><span>[Grace's Full Name] · Special Education</span><span>[email address]</span></footer>
</div>

<script>
const K=["[Class 1]","[Class 2]","[Class 3]"];
const TOP=["[Money & Banking]","[Time & Measurement]","[Equations & Algebra]","[Social & Emotional Skills]","[Organization & Self-Advocacy]"];
const pad=n=>String(n).padStart(3,"0");
let filt={plans:"all",materials:"all",slides:"all",plansS:"all",materialsS:"all",slidesS:"all"};

function filterBar(key,extra){
  const opts=[["all","All"],...K.map((k,i)=>[String(i),k])];
  return `<div class="filters"><span class="lab">Class</span>${opts.map(([v,l])=>`<button data-f="${key}" data-v="${v}" class="${filt[key]===v?"on":""}">${l}</button>`).join("")}
  ${extra||""}</div>
  <div class="filters"><span class="lab">Skill</span>${[["all","All"],...TOP.map((t,i)=>[String(i),t])].map(([v,l])=>`<button data-f="${key}S" data-v="${v}" class="${filt[key+"S"]===v?"on":""}">${l}</button>`).join("")}</div>`;
}
const rowsFor=(n,f,s="all")=>Array.from({length:n},(_,i)=>({i:i+1,k:i%3,s:i%5})).filter(r=>(f==="all"||String(r.k)===f)&&(s==="all"||String(r.s)===s));

const V={
home:()=>`<section class="grid">
  <div class="c8"><h1 class="giant">[First<br>Last]</h1></div>
  <div class="c4" style="align-self:end;display:flex;flex-direction:column;gap:14px">
    <div class="mono">SPECIAL EDUCATION · [CERTIFICATION AREA]</div>
    <p class="ph">[Two-sentence introduction: who she is, where she student taught, and the students she serves.]</p>
    <div class="btns"><a class="btn" href="#resume">Résumé</a><a class="btn alt" href="#about">About</a></div>
  </div>
</section>
<section>
  <div class="mono" style="padding-bottom:10px">INDEX</div>
  <div class="idx">
    ${[["plans","Lesson Plans","[#] plans"],["materials","Materials","[#] items"],["slides","Slides","[#] decks"],["reflections","Reflections","[#] entries"]]
      .map(([r,t,c],i)=>`<a href="#${r}"><span class="mono">${pad(i+1)}</span><span><span class="t">${t}</span><br><span class="count">${c} · across 3 classes</span></span><span class="arrow">→</span></a>`).join("")}
  </div>
</section>
<section class="grid">
  ${K.map((k,i)=>`<div class="c4" style="border-top:2px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px">
     <span class="tag k${i+1}" style="align-self:start">${k}</span><h2>[Class ${i+1} Name]</h2><p class="ph" style="font-size:14px">[One-line description of the class.]</p></div>`).join("")}
</section>
<section><div class="mono" style="padding-bottom:10px">BROWSE BY SKILL</div>
<div class="idx">${TOP.map((t,i)=>`<a href="#plans" data-skill="${i}"><span class="mono">S${i+1}</span><span><span class="t" style="font-size:clamp(1.2rem,2.6vw,1.8rem)">${t}</span><br><span class="count">[#] plans · [#] materials</span></span><span class="arrow">→</span></a>`).join("")}</div></section>`,

plans:()=>`<section><div class="grid"><div class="c8"><h1>Lesson Plans</h1></div><div class="c4" style="align-self:end"><p class="ph">[One sentence on her lesson plan format, e.g. framework used.]</p></div></div></section>
${filterBar("plans",`<span class="lab" style="margin-left:auto">Sort</span><button class="on">Date</button><button>Topic</button>`)}
<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Lesson</th><th>Class</th><th>Skill</th><th>Date</th></tr></thead><tbody>
${rowsFor(15,filt.plans,filt.plansS).map(r=>`<tr class="row" data-go="lesson"><td class="num">${pad(r.i)}</td><td class="title">[Lesson ${r.i} Title]</td><td><span class="tag k${r.k+1}">${K[r.k]}</span></td><td class="ph">${TOP[r.s]}</td><td class="mono">[MM/DD]</td></tr>`).join("")}
</tbody></table></div>`,

materials:()=>`<section><div class="grid"><div class="c8"><h1>Materials</h1></div><div class="c4" style="align-self:end"><p class="ph">[Worksheets, games, notes and activities she designed.]</p></div></div></section>
${filterBar("materials",`<span class="lab" style="margin-left:auto">Type</span><button class="on">All</button><button>Worksheets</button><button>Games</button><button>Notes</button>`)}
<div class="mat" style="padding-top:28px">${rowsFor(15,filt.materials,filt.materialsS).map(r=>`<a href="#material"><div class="sq">[Material image]</div><span class="tt">[Material ${r.i} Name]</span><span class="mono">${K[r.k]} · ${TOP[r.s]}</span></a>`).join("")}</div>`,

slides:()=>`<section><h1>Slides</h1></section>${filterBar("slides")}
<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Deck</th><th>Class</th><th>Week</th><th></th></tr></thead><tbody>
${rowsFor(15,filt.slides,filt.slidesS).map(r=>`<tr class="row" data-go="deck"><td class="num">${pad(r.i)}</td><td class="title">[Slide Deck ${r.i} Title]</td><td><span class="tag k${r.k+1}">${K[r.k]}</span></td><td class="mono">WK [#]</td><td class="mono">VIEW →</td></tr>`).join("")}
</tbody></table></div>`,

reflections:()=>`<section class="grid"><div class="c8"><h1>Reflections</h1></div><div class="c4" style="align-self:end"><p class="ph">[Short intro to her weekly student teaching journal.]</p></div></section>
<section style="padding-top:24px">${Array.from({length:6},(_,i)=>`<div class="rr"><div><div class="mono">WEEK ${pad(i+1)}</div><div class="mono">[Date range]</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><h2>[Reflection ${i+1} Heading]</h2><p class="ph">[Two or three lines from the de-identified journal entry for this week…]</p><a class="mono" href="#reflections" style="color:var(--accent)">READ ENTRY →</a></div></div>`).join("")}</section>`,

about:()=>`<section class="grid">
  <div class="c4"><div class="meta"><dl><div><dt>Program</dt><dd>[Degree · University]</dd></div><div><dt>Placement</dt><dd>[School · Semester]</dd></div><div><dt>Focus</dt><dd>[Certification area]</dd></div><div><dt>Classes taught</dt><dd>[Class 1] · [Class 2] · [Class 3]</dd></div></dl></div></div>
  <div class="c8" style="display:flex;flex-direction:column;gap:20px">
    <div class="mono">ABOUT</div><h1>[Heading]</h1>
    <p class="ph">[Paragraph 1 of teaching philosophy.]</p><p class="ph">[Paragraph 2.]</p><p class="ph">[Paragraph 3.]</p>
    <div class="grid" style="padding-top:12px">${["Approach","Strengths","Goals"].map(h=>`<div class="c4" style="border-top:2px solid var(--line);padding-top:10px"><div class="mono">${h.toUpperCase()}</div><p class="ph" style="font-size:14px">[Short point]</p></div>`).join("")}</div>
  </div></section>`,

resume:()=>`<section class="grid"><div class="c8"><h1>Résumé</h1><p class="ph" style="padding-top:12px">[City, State] · [email] · [link]</p></div>
<div class="c4" style="align-self:end"><a class="btn" href="#resume">Download PDF ↓</a></div></section>
<section>${["Education","Experience","Certifications","Skills"].map(s=>`<div class="rr"><div class="mono">${s.toUpperCase()}</div><div style="display:flex;flex-direction:column;gap:6px"><b>[Role / Degree]</b><span class="ph">[Organization] · [Dates]</span><p class="ph" style="font-size:15px">[Detail line]</p></div></div>`).join("")}</section>`,

material:()=>`<section><a class="back" href="#materials">← ALL MATERIALS</a></section>
<section class="grid" style="padding-top:20px">
 <div class="c6"><div class="sq" id="mprev" style="aspect-ratio:8.5/11;font-size:13px">[Full-page preview of the worksheet]</div></div>
 <div class="c6" style="display:flex;flex-direction:column;gap:20px">
  <div class="mono">MATERIAL · [WORKSHEET]</div><h1>[Material Title]</h1>
  <p class="ph" style="font-size:18px">[One or two sentences on what students do with it.]</p>
  <div class="meta"><dl><div><dt>Class</dt><dd>[Class Name]</dd></div><div><dt>Skill</dt><dd>${TOP[0]}</dd></div><div><dt>Used in</dt><dd><a href="#lesson" style="color:var(--accent)">[Lesson Title] →</a></dd></div><div><dt>Made with</dt><dd>[Canva]</dd></div></dl></div>
  <div class="btns"><button class="btn" data-key>Show answer key</button><a class="btn alt" href="#material">Download PDF ↓</a></div>
  ${[["How I designed it","[Design choices: visuals, chunking, supports.]"],["Differentiation","[Versions or supports for different learners.]"]].map(([h,b])=>`<div class="block" style="grid-template-columns:140px 1fr"><h3>${h}</h3><div class="ph">${b}</div></div>`).join("")}
 </div></section>
<section><div class="mono" style="border-top:2px solid var(--line);padding-top:14px;margin-bottom:20px">MORE FROM THIS LESSON</div>
<div class="mat">${[1,2,3,4].map(i=>`<a href="#material"><div class="sq">[Material image]</div><span class="tt">[Material ${i}]</span></a>`).join("")}</div></section>`,

deck:()=>`<section><a class="back" href="#slides">← ALL SLIDES</a></section>
<section style="padding-top:20px;display:flex;flex-direction:column;gap:20px">
 <div class="grid"><div class="c8"><div class="mono">SLIDE DECK · [CLASS NAME] · WEEK [#]</div><h1 style="padding-top:8px">[Slide Deck Title]</h1></div>
 <div class="c4" style="align-self:end"><div class="btns"><a class="btn" href="#deck">Open in Canva ↗</a><a class="btn alt" href="#lesson">Lesson plan</a></div></div></div>
 <div class="sq" id="slide" style="aspect-ratio:16/9;font-size:14px">[Slide 1 of 12]</div>
 <div class="filters" style="justify-content:space-between"><button data-sl="-1">← Previous</button><span class="mono" id="slnum">1 / 12</span><button data-sl="1">Next →</button></div>
 <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px">${Array.from({length:12},(_,i)=>`<button class="sq" data-go-sl="${i}" style="aspect-ratio:16/9;border:0;cursor:pointer;font-size:10px">[${i+1}]</button>`).join("")}</div>
</section>`,

lesson:()=>`<section><a class="back" href="#plans">← ALL LESSON PLANS</a></section>
<section class="grid" style="padding-top:20px">
  <aside class="c3"><div class="side meta"><dl>
    <div><dt>Class</dt><dd>[Class Name]</dd></div><div><dt>Date</dt><dd>[Month Day]</dd></div>
    <div><dt>Week</dt><dd>[#]</dd></div><div><dt>Grade</dt><dd>[9–12]</dd></div><div><dt>Length</dt><dd>[90 min]</dd></div>
    <div><dt>Skill</dt><dd>${TOP[0]}</dd></div></dl>
    <div class="btns" style="padding-top:20px"><a class="btn" href="#lesson">PDF ↓</a><a class="btn alt" href="#deck">Slides</a></div></div></aside>
  <div class="c9" style="display:flex;flex-direction:column;gap:20px">
    <h1>[Lesson Title]</h1>
    <p class="ph" style="font-size:19px">[Essential question for the lesson.]</p>
    <div>
      ${[["Standards","[Standard code: text]"],["Objectives","<ul><li>[Objective 1]</li><li>[Objective 2]</li><li>[Objective 3]</li></ul>"],["Differentiation","<ul><li>[Group / accommodation 1]</li><li>[Group / accommodation 2]</li></ul>"],["Assessment","[Formative and summative checks]"],["Sequence","<ul><li>[Warm-up]</li><li>[Instruction]</li><li>[Practice]</li><li>[Closure]</li></ul>"]]
       .map(([h,b])=>`<div class="block"><h3>${h}</h3><div class="ph">${b}</div></div>`).join("")}
    </div>
    <div style="border-top:2px solid var(--line);padding-top:14px" class="mono">MATERIALS USED</div>
    <div class="mat">${[1,2,3].map(i=>`<a href="#material"><div class="sq">[Material image]</div><span class="tt">[Material ${i}]</span></a>`).join("")}</div>
  </div>
</section>`
};

function render(){
  const r=location.hash.slice(1)||"home";
  const page=document.getElementById("page");
  page.innerHTML=(V[r]||V.home)();
  const navKey={lesson:"plans",material:"materials",deck:"slides"}[r]||r;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===navKey));
  page.querySelectorAll("tr.row").forEach(tr=>tr.addEventListener("click",()=>location.hash=tr.dataset.go));
  page.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>{const p=page.querySelector("#mprev");const k=!p.dataset.k;p.dataset.k=k?"1":"";p.textContent=k?"[Answer key preview]":"[Full-page preview of the worksheet]";b.textContent=k?"Show student version":"Show answer key"}));
  let sl=0;const setSl=i=>{sl=(i+12)%12;const s=page.querySelector("#slide");if(!s)return;s.textContent=`[Slide ${sl+1} of 12]`;page.querySelector("#slnum").textContent=`${sl+1} / 12`;page.querySelectorAll("[data-go-sl]").forEach(t=>t.style.outline=+t.dataset.goSl===sl?"2px solid var(--accent)":"none")};
  page.querySelectorAll("[data-sl]").forEach(b=>b.addEventListener("click",()=>setSl(sl+ +b.dataset.sl)));
  page.querySelectorAll("[data-go-sl]").forEach(b=>b.addEventListener("click",()=>setSl(+b.dataset.goSl)));
  setSl(0);
  page.querySelectorAll("a[data-skill]").forEach(a=>a.addEventListener("click",()=>{filt.plans="all";filt.plansS=a.dataset.skill}));
  page.querySelectorAll("button[data-f]").forEach(b=>b.addEventListener("click",()=>{filt[b.dataset.f]=b.dataset.v;const y=scrollY;render();scrollTo(0,y)}));
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();
</script>
