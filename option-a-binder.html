<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Portfolio Option A · Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;0,700;1,500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single punched binder sheet with colored index tabs down its right edge; one tab per class. */
:root{
  --desk:#e7e9ec;       /* surface behind the binder */
  --sheet:#fdfdfb;      /* paper */
  --ink:#1f2a3a;        /* navy ink */
  --muted:#5f6b7a;
  --rule:#cfd6df;
  --tab1:#d9a62e;       /* class 1 tab: mustard */
  --tab2:#2f8a84;       /* class 2 tab: teal */
  --tab3:#7a4f86;       /* class 3 tab: plum */
  --tabn:#b8c0ca;       /* neutral tabs */
  --display:"Petrona", Georgia, "Times New Roman", serif;
  --body:"Public Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:inherit}
:focus-visible{outline:2px solid var(--tab2);outline-offset:2px}
.mock{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-block:14px}
.mock b{color:var(--ink)}
.binder{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 132px;align-items:start}
.sheet{background:var(--sheet);min-height:80vh;position:relative;padding:48px 56px 64px 92px;box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(31,42,58,.35);min-width:0}
/* three punched holes */
.sheet::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:22px;
  background:radial-gradient(circle at 11px 11px,var(--desk) 10px,transparent 11px) 0 12%/22px 22px no-repeat,
             radial-gradient(circle at 11px 11px,var(--desk) 10px,transparent 11px) 0 50%/22px 22px no-repeat,
             radial-gradient(circle at 11px 11px,var(--desk) 10px,transparent 11px) 0 88%/22px 22px no-repeat}
.sheet::after{content:"";position:absolute;left:68px;top:0;bottom:0;border-left:1px solid #e9c9c9}
.tabs{display:flex;flex-direction:column;gap:6px;padding-top:40px}
.tabs a{display:block;text-decoration:none;font-size:13px;font-weight:600;padding:12px 14px 12px 12px;background:var(--tabn);color:var(--ink);
  border-radius:0 6px 6px 0;transition:transform .15s;transform-origin:left}
.tabs a:hover{transform:translateX(4px)}
.tabs a.on{transform:translateX(-2px);box-shadow:inset 3px 0 0 var(--sheet)}
.tabs a[data-c="1"]{background:var(--tab1)} .tabs a[data-c="2"]{background:var(--tab2);color:#fff} .tabs a[data-c="3"]{background:var(--tab3);color:#fff}
.tabs .gap{height:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.5vw,3.1rem)}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.ph{color:var(--muted);font-style:italic}
p{max-width:64ch;margin:0}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-lg{display:flex;flex-direction:column;gap:40px}
.lede{font-family:var(--display);font-size:1.25rem;font-style:italic;color:var(--muted)}
.intro{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start}
.intro>div{min-width:0}
/* table of contents with leader dots */
.toc{list-style:none;margin:0;padding:0}
.toc li{border-bottom:1px solid var(--rule)}
.toc a{display:flex;align-items:baseline;gap:10px;padding:12px 0;text-decoration:none}
.toc .lbl{font-family:var(--display);font-size:1.15rem;font-weight:500}
.toc .dots{flex:1;border-bottom:1px dotted var(--muted);transform:translateY(-4px);min-width:20px}
.toc .meta{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.toc a:hover .lbl{text-decoration:underline;text-underline-offset:4px}
.swatch{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px}
.unit{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:18px}
/* lesson doc */
.doc-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.doc-head div{padding:10px 12px 10px 0;font-size:13px}
.doc-head span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.domain{border-top:1px solid var(--rule);padding-top:18px;display:grid;grid-template-columns:200px 1fr;gap:24px}
.domain>div{min-width:0}
.domain h3{font-size:1rem}
.domain ul{margin:0;padding-left:18px}
.attach{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.attach li{font-size:13px}
.attach .thumb{aspect-ratio:8.5/11;background:repeating-linear-gradient(0deg,#f3f5f7 0 14px,#e8ecf0 14px 15px);border:1px solid var(--rule);display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:6px;text-align:center;padding:6px}
.back{font-size:14px;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.attach a{text-decoration:none;display:block}
.attach a:hover{text-decoration:underline;text-underline-offset:3px}
.mat-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
.bigprev{aspect-ratio:8.5/11;max-width:100%;background:repeating-linear-gradient(0deg,#f3f5f7 0 14px,#e8ecf0 14px 15px);border:1px solid var(--rule);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
button.btn{font:inherit;font-size:14px;font-weight:600;background:none;color:var(--ink);cursor:pointer}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;font-size:14px;font-weight:600;padding:10px 16px;border:1.5px solid var(--ink);text-decoration:none}
.btn:hover{background:var(--ink);color:var(--sheet)}
.resume-row{display:grid;grid-template-columns:160px 1fr;gap:24px;border-top:1px solid var(--rule);padding-top:16px}
.resume-row>div{min-width:0}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.cols3 a{text-decoration:none;display:block;border-top:6px solid var(--c);padding-top:12px}
.cols3 a:hover h3{text-decoration:underline;text-underline-offset:4px}
@media (max-width:760px){
  .binder{grid-template-columns:1fr}
  .tabs{flex-direction:row;flex-wrap:wrap;padding-top:0;order:-1;gap:4px}
  .tabs a{border-radius:6px 6px 0 0;padding:10px 12px;font-size:12px}
  .tabs a:hover,.tabs a.on{transform:none}
  .tabs .gap{display:none}
  .sheet{padding:32px 20px 48px 52px}
  .sheet::before{left:12px} .sheet::after{left:42px}
  .intro,.domain,.resume-row,.mat-grid{grid-template-columns:1fr}
  .toc a{flex-wrap:wrap}
  .toc .meta{white-space:normal;flex-basis:100%}
  .toc .dots{display:none}
  .cols3{grid-template-columns:1fr}
  .doc-head{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="mock"><a href="index.html" style="color:inherit;font-weight:600">← All options</a> · <b>Option A · Binder</b> · organized by class · placeholder content</div>

<div class="binder">
  <main class="sheet" id="page" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sections">
    <a href="#home" data-r="home">Home</a>
    <a href="#about" data-r="about">About Me</a>
    <span class="gap"></span>
    <a href="#class-1" data-r="class-1" data-c="1">[Class 1]</a>
    <a href="#class-2" data-r="class-2" data-c="2">[Class 2]</a>
    <a href="#class-3" data-r="class-3" data-c="3">[Class 3]</a>
    <span class="gap"></span>
    <a href="#topic-1" data-r="skills">By Skill</a>
    <a href="#resume" data-r="resume">Résumé</a>
  </nav>
</div>

<script>
const classes={1:{c:"var(--tab1)"},2:{c:"var(--tab2)"},3:{c:"var(--tab3)"}};
const lessons=n=>Array.from({length:n},(_,i)=>i+1);
const units=[["[Unit A Name]",[1,2,3,4]],["[Unit B Name]",[5,6,7]],["[Unit C Name]",[8,9,10]]];
const TOP=["[Money & Banking]","[Time & Measurement]","[Equations & Algebra]","[Social & Emotional Skills]","[Organization & Self-Advocacy]"];

const V={
home:()=>`<div class="stack-lg">
  <div>
    <div class="stack">
      <div class="eyebrow">Special Education · [Certification Area]</div>
      <h1>[Grace's Full Name]</h1>
      <p class="lede">[One-sentence teaching statement, e.g. what she believes every student can do.]</p>
      <p class="ph">[Two or three sentences introducing herself: program, school placement, the students she has taught.]</p>
      <div class="btnrow"><a class="btn" href="#resume">View résumé</a><a class="btn" href="#about">About me</a></div>
    </div>
  </div>
  <div class="stack">
    <div class="eyebrow">Contents of this binder</div>
    <div class="cols3">
      ${[1,2,3].map(n=>`<a href="#class-${n}" style="--c:${classes[n].c}"><div class="stack" style="gap:8px">
        <h3>[Class ${n} Name]</h3><p class="ph" style="font-size:14px">[Grade level · class length · short description of the class and its students]</p>
        <p style="font-size:13px;color:var(--muted)">[#] lesson plans · [#] materials</p></div></a>`).join("")}
    </div>
  </div>
  <div class="stack">
    <div class="eyebrow">Or browse by skill</div>
    <ul class="toc">${TOP.map((t,i)=>`<li><a href="#topic-${i+1}"><span class="lbl">${t}</span><span class="dots"></span><span class="meta">[#] lessons · all classes</span></a></li>`).join("")}</ul>
  </div>
</div>`,

about:()=>`<div class="stack-lg">
  <div class="stack"><div class="eyebrow">About me</div><h1>[Heading: e.g. Why I Teach]</h1>
  <p class="lede">[Pull quote from her teaching philosophy]</p></div>
  <div class="stack">
    <h2>Teaching philosophy</h2>
    <p class="ph">[Paragraph 1: her beliefs about students with disabilities and high expectations.]</p>
    <p class="ph">[Paragraph 2: how she plans, differentiates, and uses routines.]</p>
    <p class="ph">[Paragraph 3: family communication and collaboration with IEP teams.]</p>
  </div>
  <div class="stack">
    <h2>From my student teaching journal</h2>
    ${[1,2].map(i=>`<div style="border-left:3px solid var(--rule);padding-left:18px" class="stack"><div class="eyebrow">Week [#]</div><p class="ph">[Short de-identified excerpt from a journal reflection.]</p></div>`).join("")}
  </div>
</div>`,

resume:()=>`<div class="stack-lg">
  <div class="stack"><div class="eyebrow">Résumé</div><h1>[Grace's Full Name]</h1>
  <p class="ph">[City, State] · [email address] · [LinkedIn or other link]</p>
  <div class="btnrow"><a class="btn" href="#resume">Download résumé (PDF)</a></div></div>
  ${["Education","Teaching Experience","Certifications","Skills & Training"].map(s=>`<div class="resume-row"><h3>${s}</h3><div class="stack" style="gap:10px">
    <div><b>[Title / Degree / Role]</b> <span class="ph">· [Organization] · [Dates]</span></div>
    <p class="ph" style="font-size:15px">[One or two lines of detail.]</p></div></div>`).join("")}
</div>`
};

function classView(n){
  return `<div class="stack-lg">
  <div class="stack">
    <div class="eyebrow"><span class="swatch" style="background:${classes[n].c}"></span>Section ${n} of 3</div>
    <h1>[Class ${n} Name]</h1>
    <p class="ph">[Overview: grade level, class length, who the students are (no names), the focus of the class, and her role.]</p>
    <div class="doc-head">
      <div><span>Grades</span>[9–12]</div><div><span>Class length</span>[90 min]</div>
      <div><span>Lesson plans</span>[#]</div><div><span>Materials</span>[#]</div>
    </div>
  </div>
  <div class="stack">
    <h2>Lesson plans</h2>
    <ul class="toc">
      ${units.map(([u,ls])=>`<li style="border:0"><div class="unit">${u}</div></li>`+ls.map(i=>`<li><a href="#lesson-${n}"><span class="lbl">[Lesson ${i} Title]</span><span class="dots"></span><span class="meta">${TOP[(i-1)%5]} · [Date]</span></a></li>`).join("")).join("")}
    </ul>
  </div>
  <div class="stack">
    <h2>Materials from this class</h2>
    <ul class="attach">${lessons(6).map(i=>`<li><a href="#material-${n}"><div class="thumb">[Worksheet / activity image]</div>[Material ${i} Name]</a></li>`).join("")}</ul>
  </div>
</div>`;
}

function lessonView(n){
  const dom=(t,items)=>`<div class="domain"><h3>${t}</h3><div>${items}</div></div>`;
  return `<div class="stack-lg">
  <a class="back" href="#class-${n}">← Back to [Class ${n} Name]</a>
  <div class="stack">
    <div class="eyebrow"><span class="swatch" style="background:${classes[n].c}"></span>[Class ${n} Name] · Lesson plan</div>
    <h1>[Lesson Title]</h1>
    <div class="doc-head">
      <div><span>Date</span>[Month Day]</div><div><span>Week</span>[#]</div>
      <div><span>Skill</span><a href="#topic-1">${TOP[0]}</a></div><div><span>Length</span>[90 min]</div>
    </div>
  </div>
  <div class="stack">
    ${dom("Standards",`<p class="ph">[PA standard code: standard text]</p>`)}
    ${dom("Essential question",`<p class="ph">[The question students reflect on during the lesson.]</p>`)}
    ${dom("Objectives",`<ul class="ph"><li>[Objective 1]</li><li>[Objective 2]</li><li>[Objective 3]</li></ul>`)}
    ${dom("Differentiation",`<ul class="ph"><li>[Group 1 supports]</li><li>[Group 2 supports]</li><li>[IEP / 504 accommodations]</li></ul>`)}
    ${dom("Assessment",`<p class="ph">[Formative checks and evidence of learning.]</p>`)}
    ${dom("Lesson sequence",`<ul class="ph"><li>[Warm-up · min]</li><li>[Instruction · min]</li><li>[Practice · min]</li><li>[Closure · min]</li></ul>`)}
  </div>
  <div class="stack">
    <h2>Materials for this lesson</h2>
    <ul class="attach">${lessons(3).map(i=>`<li><a href="#material-${n}"><div class="thumb">[Material preview]</div>[Material ${i} Name]</a></li>`).join("")}
      <li><div class="thumb" style="aspect-ratio:16/9">[Slides preview]</div>[Slide deck link]</li></ul>
    <div class="btnrow"><a class="btn" href="#lesson-${n}">Open full lesson plan (PDF)</a></div>
  </div>
</div>`;
}

function materialView(n){
  return `<div class="stack-lg">
  <a class="back" href="#class-${n}">← Back to [Class ${n} Name]</a>
  <div class="stack">
    <div class="eyebrow"><span class="swatch" style="background:${classes[n].c}"></span>[Class ${n} Name] · Material</div>
    <h1>[Material Title]</h1>
    <div class="doc-head"><div><span>Type</span>[Worksheet]</div><div><span>Skill</span>${TOP[0]}</div><div><span>Used in</span><a href="#lesson-${n}">[Lesson Title]</a></div><div><span>Made with</span>[Canva]</div></div>
  </div>
  <div class="mat-grid">
    <div class="stack"><div class="bigprev" id="mprev">[Full-page preview of the worksheet]</div>
      <div class="btnrow"><button class="btn" data-key>Show answer key</button><a class="btn" href="#material-${n}">Download PDF</a></div></div>
    <div class="stack">
      <h3>About this material</h3><p class="ph">[What students do with it and how it fits into the lesson.]</p>
      <h3>How I designed it</h3><p class="ph">[Why she made it this way: visuals, chunking, supports.]</p>
      <h3>Differentiation</h3><ul class="ph" style="margin:0;padding-left:18px"><li>[Version or support 1]</li><li>[Version or support 2]</li></ul>
    </div>
  </div>
  <div class="stack"><h2>Other materials from this lesson</h2><ul class="attach">${[1,2,3].map(i=>`<li><a href="#material-${n}"><div class="thumb">[Material preview]</div>[Material ${i} Name]</a></li>`).join("")}</ul></div>
</div>`;
}

function topicView(t){
  return `<div class="stack-lg">
  <div class="stack"><div class="eyebrow">Browse by skill</div><h1>${TOP[t-1]}</h1>
  <p class="ph">[Short description of this skill area and why it matters for her students.]</p>
  <div class="btnrow" style="gap:6px 18px">${TOP.map((x,i)=>`<a href="#topic-${i+1}" style="font-size:14px;${i===t-1?"font-weight:600;text-decoration:underline;text-underline-offset:4px":"color:var(--muted);text-decoration:none"}">${x}</a>`).join("")}</div></div>
  ${[1,2,3].map(n=>`<div class="stack"><h3><span class="swatch" style="background:${classes[n].c}"></span>[Class ${n} Name]</h3>
    <ul class="toc">${[1,2].map(i=>`<li><a href="#lesson-${n}"><span class="lbl">[Lesson Title]</span><span class="dots"></span><span class="meta">[Date] · Week [#]</span></a></li>`).join("")}</ul></div>`).join("")}
  <div class="stack"><h2>Materials for this skill</h2><ul class="attach">${[1,2,3,4].map(i=>`<li><a href="#material-${(i-1)%3+1}"><div class="thumb">[Material image]</div>[Material ${i} Name]</a></li>`).join("")}</ul></div>
</div>`;
}

function render(){
  const r=(location.hash.slice(1)||"home");
  let html;
  if(V[r]) html=V[r]();
  else if(/^class-[123]$/.test(r)) html=classView(+r.slice(-1));
  else if(/^lesson-[123]$/.test(r)) html=lessonView(+r.slice(-1));
  else if(/^topic-[1-5]$/.test(r)) html=topicView(+r.slice(-1));
  else if(/^material-[123]$/.test(r)) html=materialView(+r.slice(-1));
  else html=V.home();
  const page=document.getElementById("page");
  page.innerHTML=html;
  page.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>{const p=page.querySelector("#mprev");const k=!p.dataset.k;p.dataset.k=k?"1":"";p.textContent=k?"[Answer key preview]":"[Full-page preview of the worksheet]";b.textContent=k?"Show student version":"Show answer key"}));
  const active=/^(lesson|material)-/.test(r)?"class-"+r.slice(-1):r.startsWith("topic-")?"skills":r;
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.r===active));
  window.scrollTo(0,0);
}
addEventListener("hashchange",render);render();
</script>

</html>
